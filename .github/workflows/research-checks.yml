name: V2 research checks
on:
  pull_request:
  push:
    branches: [main, 'research/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[boosting]'
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_checkpoint.py
      - run: python tools/check_result_index_coverage.py
      - run: python tools/check_analysis_index_coverage.py
